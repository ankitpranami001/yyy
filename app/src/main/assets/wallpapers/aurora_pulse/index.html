<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Aurora Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050811; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  let audioCtx = null;
  let padGain = null;
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

  function currentVolume() {
    const s = window.__liveHtmlState;
    if (s && (!s.soundEnabled || !s.visible)) return 0;
    return s && typeof s.volume === 'number' ? s.volume : 0.75;
  }

  function ensureAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      padGain = audioCtx.createGain();
      padGain.gain.value = 0.04 * currentVolume();
      padGain.connect(audioCtx.destination);

      const freqs = [130.81, 196.0, 261.63];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        osc.type = idx === 1 ? 'triangle' : 'sine';
        osc.frequency.value = f;
        osc.connect(padGain);
        osc.start();
      });
    } catch (_) {}
  }

  window.addEventListener('livehtml:state', () => {
    if (padGain) {
      try { padGain.gain.value = 0.04 * currentVolume(); } catch (_) {}
    }
  });

  function playChime(nx, ny) {
    const vol = currentVolume();
    if (vol <= 0) return;
    ensureAudio();
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      const idx = Math.min(scale.length - 1, Math.floor((1 - ny) * scale.length));
      const freq = scale[Math.max(0, idx)] * (nx > 0.5 ? 1.5 : 1.0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.14 * vol, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.25);
    } catch (_) {}
  }

  const stars = Array.from({ length: 65 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: 0.7 + Math.random() * 1.4,
    phase: Math.random() * Math.PI * 2,
    speed: 0.6 + Math.random() * 1.4
  }));

  const ripples = [];
  const sparks = [];

  function spawnBurst(x, y, withSound) {
    ripples.push({ x, y, r: 8, maxR: Math.max(W, H) * 0.28, alpha: 0.85, hue: 185 + Math.random() * 35 });
    for (let i = 0; i < 12; i++) {
      const ang = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
      const spd = 1.2 + Math.random() * 3.0;
      sparks.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        size: 1.5 + Math.random() * 2.2,
        color: i % 3 === 0 ? '#FF7A59' : '#22D3EE'
      });
    }
    if (withSound) playChime(x / Math.max(1, W), y / Math.max(1, H));
  }

  window.addEventListener('pointerdown', (e) => {
    spawnBurst(e.clientX, e.clientY, true);
  });

  let t = 0;
  function draw() {
    if (!document.hidden) {
      t += 0.012;
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#040712');
      bg.addColorStop(0.55, '#0A1326');
      bg.addColorStop(1, '#0F172A');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      for (const s of stars) {
        const a = 0.25 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
        ctx.fillStyle = `rgba(226, 232, 240, ${a.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const ribbons = [
        { baseY: 0.34, amp: 52, freq: 0.0042, speed: 1.0, c1: 'rgba(34, 211, 238, 0.30)', c2: 'rgba(56, 189, 248, 0.0)' },
        { baseY: 0.46, amp: 64, freq: 0.0033, speed: -0.75, c1: 'rgba(16, 185, 129, 0.24)', c2: 'rgba(16, 185, 129, 0.0)' },
        { baseY: 0.58, amp: 48, freq: 0.0048, speed: 0.6, c1: 'rgba(255, 122, 89, 0.20)', c2: 'rgba(255, 122, 89, 0.0)' }
      ];

      for (const r of ribbons) {
        const grad = ctx.createLinearGradient(0, H * (r.baseY - 0.2), 0, H * (r.baseY + 0.25));
        grad.addColorStop(0, r.c2);
        grad.addColorStop(0.45, r.c1);
        grad.addColorStop(1, r.c2);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= W + 24; x += 24) {
          const y = H * r.baseY
            + Math.sin(x * r.freq + t * r.speed) * r.amp
            + Math.cos(x * r.freq * 1.7 - t * 0.8) * (r.amp * 0.45);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 3.2;
        rp.alpha *= 0.96;
        if (rp.alpha < 0.02 || rp.r > rp.maxR) {
          ripples.splice(i, 1);
          continue;
        }
        ctx.strokeStyle = `hsla(${rp.hue}, 92%, 65%, ${rp.alpha.toFixed(2)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vx *= 0.98;
        sp.vy *= 0.98;
        sp.life -= 0.02;
        if (sp.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = sp.life;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
