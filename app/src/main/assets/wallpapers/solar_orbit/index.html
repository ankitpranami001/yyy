<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Solar Clock Orbit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070B14; touch-action: none; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  let audioCtx = null;
  let audioUnlocked = false;
  let lastSec = -1;

  function currentVolume() {
    const s = window.__liveHtmlState;
    if (s && (!s.soundEnabled || !s.visible)) return 0;
    return s && typeof s.volume === 'number' ? s.volume : 0.75;
  }

  function ensureAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (_) {}
  }

  function playSoftTick(accent) {
    const vol = currentVolume();
    if (!audioUnlocked || vol <= 0) return;
    ensureAudio();
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(accent ? 880 : 520, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime((accent ? 0.08 : 0.035) * vol, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + (accent ? 0.35 : 0.14));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.38);
    } catch (_) {}
  }

  let pulseBoost = 0;
  window.addEventListener('pointerdown', () => {
    audioUnlocked = true;
    pulseBoost = 1;
    playSoftTick(true);
  });

  const dust = Array.from({ length: 55 }, () => ({
    angle: Math.random() * Math.PI * 2,
    dist: 0.18 + Math.random() * 0.45,
    spd: (Math.random() - 0.5) * 0.004,
    r: 0.8 + Math.random() * 1.4
  }));

  function draw() {
    if (!document.hidden) {
      const now = new Date();
      const ms = now.getMilliseconds();
      const sec = now.getSeconds();
      const min = now.getMinutes();
      const hr = now.getHours();

      if (sec !== lastSec) {
        lastSec = sec;
        playSoftTick(sec === 0);
      }

      const cx = W * 0.5;
      const cy = H * 0.47;
      const baseR = Math.min(W, H) * 0.35;

      const bg = ctx.createRadialGradient(cx, cy, baseR * 0.1, cx, cy, Math.max(W, H) * 0.75);
      bg.addColorStop(0, '#121B30');
      bg.addColorStop(0.6, '#090E1B');
      bg.addColorStop(1, '#04060D');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      for (const p of dust) {
        p.angle += p.spd * (1 + pulseBoost * 3);
        const px = cx + Math.cos(p.angle) * (baseR * p.dist * 2.5);
        const py = cy + Math.sin(p.angle) * (baseR * p.dist * 2.5);
        ctx.fillStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.beginPath();
        ctx.arc(px, py, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      pulseBoost *= 0.94;

      const secAngle = ((sec + ms / 1000) / 60) * Math.PI * 2 - Math.PI / 2;
      const minAngle = ((min + sec / 60) / 60) * Math.PI * 2 - Math.PI / 2;
      const hrAngle = (((hr % 12) + min / 60) / 12) * Math.PI * 2 - Math.PI / 2;

      const rings = [
        { r: baseR * 1.0, angle: secAngle, color: '#22D3EE', dot: 7 },
        { r: baseR * 0.76, angle: minAngle, color: '#FF7A59', dot: 9 },
        { r: baseR * 0.52, angle: hrAngle, color: '#FACC15', dot: 10.5 }
      ];

      for (const ring of rings) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = ring.color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, ring.r, ring.angle - 0.9, ring.angle);
        ctx.stroke();

        const nx = cx + Math.cos(ring.angle) * ring.r;
        const ny = cy + Math.sin(ring.angle) * ring.r;
        ctx.fillStyle = ring.color;
        ctx.beginPath();
        ctx.arc(nx, ny, ring.dot, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(nx, ny, ring.dot * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      const pad2 = (n) => String(n).padStart(2, '0');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#F8FAFC';
      ctx.font = `700 ${Math.round(baseR * 0.30)}px system-ui, sans-serif`;
      ctx.fillText(`${pad2(hr)}:${pad2(min)}`, cx, cy - 6);
      ctx.fillStyle = '#94A3B8';
      ctx.font = `500 ${Math.round(baseR * 0.13)}px system-ui, sans-serif`;
      ctx.fillText(`${pad2(sec)} SEC`, cx, cy + baseR * 0.18);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
