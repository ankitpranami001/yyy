<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Cyber Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060912; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  let audioCtx = null;
  let rainGain = null;

  function currentVolume() {
    const s = window.__liveHtmlState;
    if (s && (!s.soundEnabled || !s.visible)) return 0;
    return s && typeof s.volume === 'number' ? s.volume : 0.75;
  }

  function initRainAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      const bufSize = audioCtx.sampleRate;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (last + 0.04 * white) / 1.04;
        last = data[i];
        data[i] *= 1.6;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1100;
      filter.Q.value = 0.7;

      rainGain = audioCtx.createGain();
      rainGain.gain.value = 0.06 * currentVolume();

      noise.connect(filter);
      filter.connect(rainGain);
      rainGain.connect(audioCtx.destination);
      noise.start();
    } catch (_) {}
  }

  window.addEventListener('livehtml:state', () => {
    if (rainGain) {
      try { rainGain.gain.value = 0.06 * currentVolume(); } catch (_) {}
    }
  });

  function playDropPing() {
    const vol = currentVolume();
    if (vol <= 0) return;
    initRainAudio();
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      const base = 420 + Math.random() * 520;
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.exponentialRampToValueAtTime(base * 0.55, now + 0.25);
      gain.gain.setValueAtTime(0.08 * vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } catch (_) {}
  }

  const drops = Array.from({ length: 85 }, () => ({
    x: Math.random(),
    y: Math.random(),
    len: 18 + Math.random() * 40,
    speed: 6 + Math.random() * 10,
    width: 1.0 + Math.random() * 1.2,
    coral: Math.random() < 0.22
  }));

  const splashes = [];
  let flash = 0;

  window.addEventListener('pointerdown', (e) => {
    flash = 0.4;
    playDropPing();
    for (let i = 0; i < 10; i++) {
      splashes.push({
        x: e.clientX,
        y: e.clientY,
        vx: (Math.random() - 0.5) * 6,
        vy: -2 - Math.random() * 5,
        life: 1,
        color: i % 2 === 0 ? '#22D3EE' : '#FF7A59'
      });
    }
  });

  function draw() {
    if (!document.hidden) {
      ctx.fillStyle = 'rgba(6, 9, 18, 0.30)';
      ctx.fillRect(0, 0, W, H);

      if (flash > 0.01) {
        ctx.fillStyle = `rgba(34, 211, 238, ${(flash * 0.2).toFixed(3)})`;
        ctx.fillRect(0, 0, W, H);
        flash *= 0.88;
      }

      for (const d of drops) {
        const px = d.x * W;
        const py = d.y * H;
        ctx.strokeStyle = d.coral ? 'rgba(255, 122, 89, 0.8)' : 'rgba(34, 211, 238, 0.8)';
        ctx.lineWidth = d.width;
        ctx.beginPath();
        ctx.moveTo(px - d.len * 0.08, py - d.len);
        ctx.lineTo(px, py);
        ctx.stroke();

        d.y += d.speed / Math.max(300, H);
        d.x += (d.speed * 0.08) / Math.max(300, W);
        if (d.y > 1.06) {
          d.y = -0.06;
          d.x = Math.random();
        }
        if (d.x > 1.05) d.x -= 1.05;
      }

      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.22;
        s.life -= 0.035;
        if (s.life <= 0) {
          splashes.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = s.life;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
